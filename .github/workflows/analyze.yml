
name: AgriSmart Crop Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "data/processed/**"
      - "requirements.txt"
      - ".github/workflows/analyze.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crop analysis
        run: python backend/analyze_crops.py

      - name: Save comparison results
        uses: actions/upload-artifact@v4
        with:
          name: crop-production-comparison
          path: data/processed/crop_production_comparison.csv
          if-no-files-found: error
